name: Verify and publish isolated compatible Android preview
on:
  workflow_dispatch:
    inputs:
      expected_runtime:
        type: string
        required: true
        description: Runtime fingerprint inspected from the installed signed APK
jobs:
  compatible_preview:
    type: update
    # Preview B includes the Firebase Android client file. Resolve these actual
    # inputs and compare with the inspected APK before publishing any update.
    environment: preview
    params:
      channel: preview
      platform: android
      message: Manual isolated release acceptance update
    hooks:
      before_update:
        - run: node scripts/check-build-inputs.mjs
        - run: node scripts/check-update-runtime.mjs ${{ inputs.expected_runtime }}
