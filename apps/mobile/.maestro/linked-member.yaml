appId: in.nmtsolutions.travel
---
# Run after signing in by the SECOND method to an existing member.
- extendedWaitUntil:
    visible: "Account"
    timeout: 30000
- tapOn: "Account"
- extendedWaitUntil:
    visible: "Profile saved"
    timeout: 30000
- assertNotVisible:
    id: username-input
- assertVisible: ${MAESTRO_EMAIL}
- assertVisible: "@${MAESTRO_USERNAME}"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Account"
    timeout: 30000
- tapOn: "Account"
- extendedWaitUntil:
    visible: "Profile saved"
    timeout: 30000
- assertVisible: "@${MAESTRO_USERNAME}"
