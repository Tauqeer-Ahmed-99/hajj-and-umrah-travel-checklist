appId: in.nmtsolutions.travel
---
# Run after choosing a NEW Google account in the actual native chooser.
# Use an account with these known names to verify that prefilling works.
- extendedWaitUntil:
    visible: "Let’s get to know you"
    timeout: 30000
- assertVisible:
    id: first-name-input
    text: ${MAESTRO_FIRST_NAME}
- scrollUntilVisible:
    element:
      id: last-name-input
- assertVisible:
    id: last-name-input
    text: ${MAESTRO_LAST_NAME}
- scrollUntilVisible:
    element:
      id: username-input
- tapOn:
    id: username-input
- inputText: ${MAESTRO_USERNAME}
- hideKeyboard
- scrollUntilVisible:
    element: "Save profile"
- tapOn: "Save profile"
- extendedWaitUntil:
    visible: "Profile saved"
    timeout: 30000
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Profile saved"
    timeout: 30000
- assertVisible: ${MAESTRO_EMAIL}
- assertVisible: "@${MAESTRO_USERNAME}"
