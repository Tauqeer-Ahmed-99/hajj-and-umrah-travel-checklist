appId: in.nmtsolutions.travel
---
# Run after choosing a NEW Google account in the actual native chooser.
# Use an account with these known names to verify that prefilling works.
- extendedWaitUntil:
    visible: "What’s your name?"
    timeout: 30000
- assertVisible:
    id: first-name-input
    text: ${MAESTRO_FIRST_NAME}
- scrollUntilVisible:
    element:
      id: last-name-input
- assertVisible:
    id: last-name-input
    text: ${MAESTRO_LAST_NAME}
- hideKeyboard
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Choose your username"
    timeout: 30000
- tapOn:
    id: username-input
- inputText: ${MAESTRO_USERNAME}
- hideKeyboard
- scrollUntilVisible:
    element: "Start planning"
- tapOn: "Start planning"
- extendedWaitUntil:
    visible: "Account"
    timeout: 30000
- tapOn: "Account"
- extendedWaitUntil:
    visible: "Your account"
    timeout: 30000
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Account"
    timeout: 30000
- tapOn: "Account"
- extendedWaitUntil:
    visible: "Your account"
    timeout: 30000
- assertVisible: ${MAESTRO_EMAIL}
- assertVisible: "@${MAESTRO_USERNAME}"
