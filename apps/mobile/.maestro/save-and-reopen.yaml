appId: in.nmtsolutions.travel
---
# Continue on the code screen from request-code.yaml with a real mailbox code.
- tapOn:
    id: code-input
- inputText: ${MAESTRO_EMAIL_CODE}
- hideKeyboard
- tapOn: "Verify and continue"
- extendedWaitUntil:
    visible: "What’s your name?"
    timeout: 30000
- tapOn:
    id: first-name-input
- inputText: "Sana"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: last-name-input
- tapOn:
    id: last-name-input
- inputText: "Ahmed"
- hideKeyboard
- hideKeyboard
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Choose your username"
    timeout: 30000
- tapOn:
    id: username-input
- inputText: ${MAESTRO_USERNAME}
- hideKeyboard
- scrollUntilVisible:
    element: "Start planning"
- tapOn: "Start planning"
- extendedWaitUntil:
    visible: "Your trips"
    timeout: 30000
- tapOn: "Account"
- extendedWaitUntil:
    visible: "Your account"
    timeout: 30000
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Your trips"
    timeout: 30000
- tapOn: "Account"
- extendedWaitUntil:
    visible: "Your account"
    timeout: 30000
- assertVisible: ${MAESTRO_EMAIL}
- assertVisible: "@${MAESTRO_USERNAME}"
- scrollUntilVisible:
    element: "Sign out"
- tapOn: "Sign out"
- extendedWaitUntil:
    visible: "Get started"
    timeout: 30000
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Get started"
    timeout: 30000
- assertNotVisible: ${MAESTRO_EMAIL}
- assertNotVisible: "@${MAESTRO_USERNAME}"
