appId: in.nmtsolutions.travel
---
# Start on the same trip's Overview as a member with trip viewer access.
# The organizer journey must have run using MAESTRO_ITINERARY_RUN.
- scrollUntilVisible:
    element: "Itinerary and travel details"
- tapOn: "Itinerary and travel details"
- extendedWaitUntil:
    visible: "Read-only itinerary. A trip organizer manages these details."
    timeout: 30000
- assertVisible: "During the stay"
- assertNotVisible: "Change trip phase"
- scrollUntilVisible:
    element: '[0-9]+\. Airport ${MAESTRO_ITINERARY_RUN}'
- assertVisible: '2026-11-20 18:00:00 UTC\+05:30, Asia/Kolkata'
- scrollUntilVisible:
    element: "Terminal 1 door 4"
- assertVisible: "Terminal 1 door 4"
- assertNotVisible: "Edit Airport ${MAESTRO_ITINERARY_RUN}"
- assertNotVisible: "Add stop"
