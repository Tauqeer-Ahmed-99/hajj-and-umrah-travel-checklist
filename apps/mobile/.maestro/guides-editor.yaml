appId: in.nmtsolutions.travel
---
# Start on Overview as a trip member/editor without a grant to the owning family.
# Run after the coordinator has explicitly shared Arrival GUIDE_RUN.
- tapOn:
    id: tab-guides
- extendedWaitUntil:
    visible: "Guide library"
    timeout: 30000
- tapOn:
    id: guide-search
- inputText: "Arrival ${GUIDE_RUN}"
- hideKeyboard
- tapOn: "Search guides"
- extendedWaitUntil:
    visible: "1 guide found"
    timeout: 30000
- scrollUntilVisible:
    element: "Read Arrival ${GUIDE_RUN}"
- tapOn: "Read Arrival ${GUIDE_RUN}"
- scrollUntilVisible:
    element: "Edit guide"
- assertNotVisible: "Change guide audience"
- tapOn: "Edit guide"
- scrollUntilVisible:
    element:
      id: guide-source
- tapOn:
    id: guide-source
- eraseText
- inputText: "Editor confirmed meeting point"
- hideKeyboard
- scrollUntilVisible:
    element: "Save guide"
- tapOn: "Save guide"
- extendedWaitUntil:
    visible: "Saved"
    timeout: 30000
- scrollUntilVisible:
    element: "Source: Editor confirmed meeting point"
- assertVisible: "Source: Editor confirmed meeting point"
- scrollUntilVisible:
    element: "Version history"
- tapOn: "Version history"
- extendedWaitUntil:
    visible: "Version history"
    timeout: 30000
# The old family-only creation is excluded even though the current guide is shared.
- assertNotVisible: "Read version 1"
